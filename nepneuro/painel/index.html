<style>
:root{--bg:#111;--panel:#1a1a1a;--line:rgba(177,167,155,.18);--nude:#B1A79B;--or:#D9653B;--tx:#F7FCFF;--tx2:#DCE3EB;--mut:#9E978E;--ok:#6FB08A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Sora',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:34px 28px 80px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:20px}
.brand img{height:28px}
.tag{font-size:12px;font-weight:600;letter-spacing:.22em;color:var(--mut)}
h1{font-size:clamp(32px,5vw,52px);letter-spacing:-.04em;margin:34px 0 8px;line-height:1.02}
h1 span{color:var(--nude)}
.sub{color:var(--mut);font-size:14.5px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.btn{font:inherit;font-weight:600;font-size:14px;border-radius:999px;padding:10px 18px;cursor:pointer;border:1px solid var(--nude);background:transparent;color:var(--tx)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:28px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 22px}
.kpi b{display:block;font-size:40px;letter-spacing:-.04em;color:var(--nude);line-height:1}
.kpi span{display:block;margin-top:8px;font-size:13px;color:var(--mut)}
.prog{margin-top:22px;height:10px;background:rgba(177,167,155,.14);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--or);width:0;transition:width .4s}
.filters{display:flex;gap:8px;margin-top:30px;flex-wrap:wrap}
.filters button{font:inherit;font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mut);cursor:pointer}
.filters button.on{background:var(--nude);color:#121212;border-color:var(--nude)}
.sec{margin-top:36px}
.sh{display:flex;align-items:center;gap:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sh .n{color:var(--or);font-weight:700;font-size:14px}
.sh h2{margin:0;font-size:24px;letter-spacing:-.025em}
.sh .c{margin-left:auto;font-size:13px;color:var(--mut)}
.sh .mini{width:120px;height:6px;background:rgba(177,167,155,.14);border-radius:99px;overflow:hidden}
.sh .mini i{display:block;height:100%;background:var(--nude)}
.it{display:grid;grid-template-columns:110px minmax(0,1fr);gap:18px;padding:18px 0;border-bottom:1px solid var(--line)}
.pill{font-size:11px;font-weight:700;letter-spacing:.16em;padding:6px 10px;border-radius:999px;text-align:center;align-self:start}
.pill.ok{background:rgba(111,176,138,.15);color:var(--ok)}
.pill.par{background:rgba(217,101,59,.14);color:var(--or)}
.pill.no{background:rgba(177,167,155,.10);color:var(--mut)}
.q{font-size:15.5px;line-height:1.5;color:var(--tx2);font-weight:500}
.ans{margin-top:10px;background:var(--panel);border-left:3px solid var(--nude);border-radius:0 10px 10px 0;padding:12px 14px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;color:var(--tx)}
.files{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
.files a{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13.5px;color:var(--tx);text-decoration:none;max-width:100%}
.files a:hover{border-color:var(--or)}
.files a em{font-style:normal;color:var(--mut);font-size:12px}
.files a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.own{margin-top:6px;font-size:12.5px;font-weight:600;letter-spacing:.06em;color:var(--nude)}
.own.none{color:var(--mut);font-weight:500}
.when{margin-top:8px;font-size:12px;color:var(--mut)}
.empty{color:var(--mut);font-size:14px;margin-top:6px}
.ov{position:fixed;inset:0;background:var(--bg);display:grid;place-content:center;color:var(--mut);text-align:center;padding:24px;z-index:9}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.it{grid-template-columns:1fr;gap:8px}.pill{justify-self:start}.sh .mini{display:none}}
</style>
</head>

   sec.innerHTML='<div class="sh"><span class="n">'+String(si+1).padStart(2,'0')+'</span><h2>'+esc(s.t)+'</h2><span class="c">'+c+' de '+s.i.length+' prontos</span><span class="mini"><i style="width:'+(c/s.i.length*100)+'%"></i></span></div>';
   items.forEach(function(it){
    var st=stateOf(it),r=P.resp[it.k],a=P.anx[it.k]||[];
    var d=document.createElement('div');d.className='it';
    var lab={ok:'PRONTO',par:'EM ANDAMENTO',no:'SEM NADA'}[st];
    var h='<span class="pill '+st+'">'+lab+'</span><div><div class="q">'+esc(it.q)+'</div><div class="own '+((r&&r.dono)?'':'none')+'">'+((r&&r.dono)?'Responsável: '+esc(r.dono):'Sem responsável definido')+'</div>';
    if(r&&r.texto.trim())h+='<div class="ans">'+esc(r.texto)+'</div>';
    if(a.length){h+='<div class="files">';a.forEach(function(x){h+='<a href="#" data-p="'+esc(x.caminho)+'" data-n="'+esc(x.nome)+'"><span>'+esc(x.nome)+'</span><em>'+fmtSize(x.tamanho||0)+'</em></a>'});h+='</div>'}
    if(r&&r.at)h+='<div class="when">Atualizado em '+fmtTime(r.at)+'</div>';
    if(st==='no')h+='<div class="empty">Nenhuma resposta ou anexo ainda.</div>';
    d.innerHTML=h+'</div>';
    d.querySelectorAll('.files a').forEach(function(l){l.addEventListener('click',function(e){e.preventDefault();var w=window.open('about:blank','_blank');sbSign(l.dataset.p,l.dataset.n).then(function(u){if(w)w.location=u;else location.href=u}).catch(function(){if(w)w.close();alertBox('Não foi possível abrir o arquivo.')})})});
    sec.appendChild(d);
   });
   list.appendChild(sec);
  });
 }
 function alertBox(m){document.getElementById('upd').textContent=m}
 function load(){
  return sbRpc('painel_formulario',{p_admin:ADMIN}).then(function(p){
   P={responsavel:p.responsavel,prazo:p.prazo,atualizado_em:p.atualizado_em,resp:{},anx:{}};
   (p.respostas||[]).forEach(function(r){P.resp[r.item]={texto:r.texto||'',pronto:!!r.pronto,dono:r.responsavel||'',at:r.atualizado_em}});
   (p.anexos||[]).forEach(function(a){(P.anx[a.item]=P.anx[a.item]||[]).push(a)});
   render();var ov=document.getElementById('ov');if(ov)ov.remove();
  });
 }
 document.getElementById('refresh').addEventListener('click',function(){load().catch(function(){alertBox('Sem conexão. Tente de novo.')})});
 document.getElementById('filters').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;filter=b.dataset.f;document.querySelectorAll('#filters button').forEach(function(x){x.classList.toggle('on',x===b)});render()});
 (CODE?sbRpc('acesso_admin',{p_codigo:CODE}).then(function(t){if(!t)throw new Error('x');ADMIN=t}):Promise.resolve()).then(load).catch(function(){document.getElementById('ov').textContent='Não foi possível carregar o painel. Confira o link e a conexão.'});
 setInterval(function(){load().catch(function(){})},10000);
})();
